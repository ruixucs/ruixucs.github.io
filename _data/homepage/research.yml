# Research entries on the homepage. List them newest first: the "All by date"
# view keeps this order.
#
#   title     entry title (required)
#   url       where the title and thumbnail link to (project page, paper or PDF)
#   media     thumbnail: `video` (mp4, plays while on screen) and/or `image`
#             (still image, also used as the video poster); shown at up to 320x200
#   authors   list of {name, url}; add `me: true` for yourself, `equal: true`
#             for equal contribution (*), `advising: true` for equal advising (†),
#             `note: project lead` to print "(project lead)" after the name
#   role      extra line under the authors (or instead of them), e.g. your role
#   venue     venue or status line, e.g. "Conference on Robot Learning (CoRL 2026)"
#   notes     extra lines (workshops, awards); HTML allowed, e.g.
#             '<a href="https://example.com">Workshop (CoRL 2026)</a>, <span class="award">Best Paper</span>'
#   links     list of {label, url}, shown as "Paper • Code • ..."
#   tldr      one-sentence summary
#   topics    keys from `topics` below, used by the "All by topic" view
#   selected  true to include the entry in the "Selected" view
#
# Quote values that contain ": " (common in paper titles), e.g.
#   title: "RoboFoo: Agentic Task and Motion Planning"

topics: # topics without entries get no tab
  - key: robotics
    label: Robotics
  - key: world-model
    label: World Model
  - key: 3d-vision
    label: 3D Vision
  - key: projects
    label: Projects

items:
